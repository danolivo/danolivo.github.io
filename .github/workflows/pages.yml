name: Build and deploy to GitHub Pages

# The site is built with plain Jekyll 4 rather than the classic Pages builder,
# which is pinned to Jekyll 3.10. Requires Settings -> Pages -> Source:
# "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # A Liquid tag that strips the newline in front of a block-level HTML tag
      # makes kramdown emit that tag as visible text. It renders as garbage but
      # builds cleanly, so check for it rather than trusting the exit code.
      - name: Check no HTML leaked into the page text
        run: |
          if grep -rnoE '&lt;/?(ul|ol|li|div|p|section|img|table|span|h[1-6])\b' \
               _site --include='*.html'; then
            echo "::error::escaped HTML tags found in rendered output (see matches above)"
            exit 1
          fi

      # Includes share the caller's scope, so an assignment inside one can
      # clobber a loop variable and print the whole item as a Ruby hash.
      - name: Check no Liquid data structures leaked into the page text
        run: |
          if grep -rn '=&gt;' _site --include='*.html'; then
            echo "::error::a Ruby hash reached the rendered output (see matches above)"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
