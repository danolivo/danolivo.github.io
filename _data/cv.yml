# Experience and education.
#
# Primary source: the author's own CV, github.com/danolivo/resume (resume-w.tex,
# "adopt resume for the western reader"). Dates and duties follow it. The
# pre-2017 entries (Makeyev, SUSU) come from LinkedIn — the CV trims them for
# length, the site keeps them because the whole arc is the point here.
#
# Titles are rendered for an English-speaking reader, confirmed with the author:
#   "PostgreSQL Developer"        -> "PostgreSQL Core Developer" (the plain form
#                                    reads as an application developer *using*
#                                    Postgres, not one working on the engine)
#   "Team Lead"                   -> "Tech Lead" (no direct reports)
#   "Lead of the Optimization Lab"-> "Head of the Query Optimization Lab",
#                                    seniority per LinkedIn (Principal)
#   "Guest Lecturer"              -> "Visiting Lecturer"
#   доцент                        -> "Associate Professor" (NOT "Assistant
#                                    Professor", which is a junior tenure-track
#                                    role in English and understates it)
#
# An entry may carry either `role:` (single position) or `roles:` (several
# positions at the same employer, newest first).

experience:
  - company: pgEdge
    role: Staff Software Engineer
    kind: contract, remote
    period: Sep 2025 — present
    where: Madrid, Spain
    body: >-
      Active-active logical replication across PostgreSQL clusters. Led the
      architectural redesign of the Spock extension, removing its dependencies
      on patches to core Postgres.

  - company: Postgres Professional
    period: Dec 2017 — Sep 2025
    kind: remote
    roles:
      - role: Principal Software Engineer, Head of the Query Optimization Lab
        period: Apr 2023 — Sep 2025
        body: >-
          Led query optimizer development — SwitchJoin, built-in
          re-optimization, shuffle join, distributed query optimization — and
          implemented the re-optimization feature for the enterprise fork.
          Contributed optimization features and patch reviews to PostgreSQL
          core, reviewed the lab's code, spoke at conferences on query
          optimization, and kept a technical blog.
      - role: PostgreSQL Core Developer, Tech Lead
        period: Oct 2021 — Apr 2023
        body: >-
          Designed the query plan freezing extension (sr_plan) and architected
          the Shardman prototype, a distributed database system built on
          PostgreSQL. Began the self-join elimination and GROUP BY reordering
          work that later landed in PostgreSQL 18 and 17.
      - role: PostgreSQL Core Developer
        period: Dec 2017 — Oct 2021
        body: >-
          Developed the Multimaster extension and implemented parallel recovery;
          maintained the Adaptive Query Optimizer. First core contributions
          landed in PostgreSQL 12: less write-ahead log during GiST, GIN and
          SP-GiST index builds.

  - company: Academician V.P. Makeyev State Rocket Centre
    role: Senior Scientist
    kind: contract, full-time
    period: Mar 2010 — Mar 2018
    where: Miass, Russia
    body: >-
      Team lead for CAE modeling of supersonic and hypersonic flows around
      re-entry vehicles and upper spacecraft stages; computation of heat loads
      and thermal design of shielding systems; design and implementation of
      mathematical models of high-enthalpy flows. Tooling: ANSYS Fluent with
      user-defined functions, FlowVision, the Monte-Carlo code SMILE, ANSYS
      Mechanical and Mechanical APDL, plus purpose-built thermal analysis
      programs.

  - company: South Ural State University
    period: Jul 2005 — May 2012
    roles:
      - role: Visiting Lecturer
        kind: part-time
        period: Sep 2010 — May 2012
        where: Miass, Russia
        body: Gas dynamic analysis; parallel computation in CAE software.
      - role: Associate Professor
        kind: full-time
        period: Jul 2005 — May 2010
        where: Chelyabinsk, Russia
        body: >-
          Research on parallel methods for database systems and C/C++/Java
          systems programming. Taught software engineering, parallel methods for
          database systems, technical aspects of IT law, and geoinformation
          systems in a database context.

