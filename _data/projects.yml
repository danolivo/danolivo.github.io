# Projects, grouped on the page by `group`:
#   core      — work contributed to PostgreSQL itself
#   system    — database systems worked on as a whole
#   extension — PostgreSQL extensions
#   prototype — proposed upstream and/or carried in enterprise forks, plus dead
#               ends kept for the record (the former "OptLab" page)
#
# Descriptions are the author's own wording, lightly edited.
#
# `personal: true` marks an extension that lives under the author's own account
# rather than an employer's organization. The /cv page uses it to separate the
# upstream and personal work from the products of whoever was paying at the time.
#
# The `core` list and its `release:` fields were established from the upstream
# git history, checked against the release branches rather than against commit
# ancestry — three of these features were committed, reverted, and committed
# again in a later cycle, so ancestry alone names the wrong release.

- name: DBMS Digest
  group: tool
  status: live
  featured: true
  summary: a weekly, ad-free, fact-checked roundup of what actually happened in databases
  body: >-
    "Signal over sales" — a weekly roundup of what actually happened in
    PostgreSQL and the wider database world: new features and internals,
    threads worth reading on pgsql-hackers, -bugs and -performance, community
    arguments, migration case studies, techniques borrowed from SQL Server,
    Oracle, MySQL and OceanBase, and academic work. Fifteen to twenty-five
    curated links an edition, no marketing, written for people who work on
    database internals rather than for buyers. Generated rather than
    hand-assembled — the reasoning behind that is in the blog post below.
  links:
    - name: read it
      url: https://danolivo.github.io/dbms-digest/
    - name: RSS
      url: https://danolivo.github.io/dbms-digest/feed.xml
    - name: source
      url: https://github.com/danolivo/dbms-digest
    - name: why it exists
      url: https://danolivo.substack.com/p/a-generative-postgres-digest-from

- name: Self-Join Elimination
  group: core
  release: PostgreSQL 18
  body: >-
    Drop a self-join from the query tree when a single scan provably returns the
    same rows. Committed for 17, reverted, redesigned and committed again for 18;
    the RowMark and placeholder edge cases that caused the revert are fixed in the
    version that shipped.

- name: OR-clause to array transformation
  group: core
  release: PostgreSQL 18
  body: >-
    Turn a long chain of OR'd equality tests into a single ScalarArrayOpExpr, so
    the planner can match it to an index or a bitmap path instead of walking the
    chain. Also reverted once before landing.

- name: GROUP BY key reordering
  group: core
  release: PostgreSQL 17
  body: >-
    The optimizer is free to choose the order of grouping columns; ordering them
    to cut comparison work is now a costed choice, controlled by
    enable_group_by_reordering.

- name: Extended statistics for hash join bucket size
  group: core
  release: PostgreSQL 18
  body: >-
    Use multivariate statistics to estimate hash join bucket size, instead of
    assuming independence between the hash keys.

- name: Tuple-bound propagation through Append
  group: core
  release: PostgreSQL 18
  body: >-
    Teach Append to take the query's tuple fraction into account when
    accumulating subpaths, so a LIMIT above a partitioned scan is not planned as
    though every partition would be read in full.

- name: PG_MODULE_MAGIC_EXT
  group: core
  release: PostgreSQL 18
  body: >-
    An extension can now declare its name and version in the module magic block,
    so the server knows what it loaded rather than inferring it.

- name: WAL volume reduction in index builds
  group: core
  release: PostgreSQL 12
  body: >-
    Generate less write-ahead log while building GiST, GIN and SP-GiST indexes,
    and drop an unnecessary copy when reading a WAL record that fits on one page.

- name: Spock
  group: extension
  years: since 2025
  status: open source
  featured: true
  summary: active-active logical replication across PostgreSQL clusters
  repo: https://github.com/pgEdge/spock
  body: >-
    Logical multi-master replication for PostgreSQL. Work here covers
    active-active replication across clusters and an architectural redesign that
    removed the extension's dependency on patches to core Postgres.

- name: Adaptive Query Optimizer (AQO)
  group: extension
  years: 2017–2021
  status: open source
  repo: https://github.com/postgrespro/aqo
  body: >-
    Database systems usually process queries of quite similar structure. The idea
    is to save information about the actual number of rows produced by query plan
    nodes and reuse it during the next execution. Two significant hurdles were
    managed here: node signatures had to be invented to match cardinalities to
    specific nodes during planning, and the knowledge base had to be generalized.
  links:
    - name: pgconf.dev 2024
      url: https://www.pgevents.ca/events/pgconfdev2024/sessions/session/147/

- name: pg_track_optimizer
  group: extension
  personal: true
  years: since 2023
  status: open source
  featured: true
  summary: finds queries the planner got wrong, before they become an incident
  repo: https://github.com/danolivo/pg_track_optimizer
  body: >-
    A lightweight PostgreSQL extension designed to identify poorly optimized
    queries — spotting planning problems before they show up as a performance
    incident.

- name: pg_middleout
  group: extension
  personal: true
  status: early stage
  featured: true
  summary: a top-down planning pass that memoizes correlated subplans
  repo: https://github.com/danolivo/pg_middleout
  body: >-
    Middle-out planning: a top-down pass added after the planner's usual
    bottom-up phase. Its first use is memoizing correlated subqueries. A
    correlated subquery that cannot be pulled up into a join becomes a SubPlan
    that re-executes for every outer row, and core PostgreSQL only attaches
    Memoize to parameterized nested loops, never to a SubPlan — so repeated
    parameter values are recomputed, which ORM-generated SQL does constantly.
    The reason core cannot fix this in place is a chicken-and-egg problem: a
    SubPlan is built during the parent query's expression preprocessing, before
    the parent's own paths exist, so neither execution frequency nor the
    distribution of parameter values — both needed to cost a Memoize — is known
    yet. Both are available once upper-query planning has finished, which is
    where this extension hooks in, walks the cheapest path tree, and swaps in a
    memoized subplan when it pays for itself.

- name: pg_index_stats
  group: extension
  personal: true
  status: open source
  featured: true
  summary: derives extended statistics automatically from the indexes you already have
  repo: https://github.com/danolivo/pg_index_stats
  body: >-
    Computing multivariate statistics automatically for every combination of
    columns is impractical. The conjecture is that index structure already tells
    you which column sets are most frequently used for extracting data, and those
    are exactly the ones that matter for building good plans.

- name: Query plan freezing (sr_plan)
  group: extension
  status: open source
  repo: https://github.com/postgrespro/sr_plan
  body: >-
    Freeze a query plan and reuse it, instead of letting the planner reconsider
    the query on every execution. Design, pitfalls and lessons learned were
    presented at the Israeli PostgreSQL Jam in 2023.

- name: Shardman
  group: system
  years: 2019–2023
  status: proprietary
  body: >-
    A distributed database system built natively on PostgreSQL. The fundamental
    conjecture is that the standard foreign data wrapper technique, as
    implemented in postgres_fdw, can be enough to partition data across multiple
    servers. The main efforts went into distributed timestamp-based transactions
    (CSN), optimizer extensibility, and the must-have features for distributed
    execution — global tables, asymmetric join, shuffle join.

    I was the architect of the project, and proposed and prototyped
    substantially all of the query optimization and distributed execution
    features it runs on today. The code is proprietary; the design is public in
    the talks and the mailing-list thread below.
  links:
    - name: CSN thread on pgsql-hackers
      url: https://www.postgresql.org/message-id/flat/07b2c899-4ed0-4c87-1327-23c750311248%40postgrespro.ru
    - name: distributed planning and execution, PGConf.EU 2019
      url: https://www.postgresql.eu/events/pgconfeu2019/schedule/session/2594-beyond-the-pushdowns-distributed-query-planning-and-execution/
    - name: Shardman at HighLoad++ Siberia 2019 (video)
      url: https://youtu.be/IoNGmwgo9ZY

- name: Multimaster
  group: system
  status: open source
  repo: https://github.com/danolivo/mmts
  body: >-
    Built-in high availability for PostgreSQL, leveraging a global transaction ID
    and logical replication. From the application's standpoint all servers hold
    equivalent data up to MVCC, with automatic conflict resolution. The
    trade-offs: transactions default to REPEATABLE READ isolation, and DML
    performance degrades as instances are added. The distance between servers is
    bounded only by network speed and the internal heartbeat timeout.
  links:
    - name: documentation
      url: https://postgrespro.github.io/mmts/
    - name: Postgres Pro Enterprise
      url: https://postgrespro.com/docs/enterprise/16/multimaster

- name: Omega — parallel DBMS for cluster systems
  group: system
  years: 2004–2008
  status: archived
  body: >-
    The subject of the Ph.D. work: query processing in a parallel DBMS for
    multiprocessor systems with a hierarchical architecture. Introduced a data
    placement and partial-mirroring strategy, and a load balancing method for
    parallel query execution on clusters.

- name: Asymmetric join
  group: prototype
  body: >-
    Oriented mostly at distributed execution. Works much like the partitionwise
    join feature, but allows a plain table to be joined with a partitioned one.
  links:
    - name: branch
      url: https://github.com/postgrespro/postgres/tree/asymmetric-join



- name: Switch Join
  group: prototype
  body: >-
    An adaptive join that stops betting everything on the planner's cardinality
    estimate. Two plans are prepared up front — an optimistic one, typically a
    nested loop, and a pessimistic fallback, typically hash or merge join. During
    execution outer tuples are materialized while actual row counts are watched;
    once the count crosses a threshold, execution switches to the pessimistic
    plan mid-flight, reusing the already-materialized data without a restart or a
    replan. Author and lead developer, with A. Rybakina, who presented the work
    at PGConf.Spb 2024 and pgconf.dev 2025. The source is not public.
  links:
    - name: how it works
      url: https://alenarybakina.substack.com/p/switch-join-postgresql-that-adapts
    - name: PGConf.Spb 2024
      url: https://pgconf.ru/talk/1904075
    - name: pgconf.dev 2025
      url: https://2025.pgconf.dev/schedule.html

- name: Query re-optimization
  group: prototype
  body: >-
    Detect at run time that a plan has gone hopelessly wrong and replan the
    query instead of waiting for it to finish. Designed and implemented for the
    Postgres Pro enterprise fork; presented at PGConf.Russia 2023.
